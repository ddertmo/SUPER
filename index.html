<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — CIVILWATCH Admin</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/global.css" />
  <style>
    body {
      background: linear-gradient(135deg, #1344B5 0%, #1A56DB 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      padding: 44px 36px;
      animation: fadeIn 0.4s ease;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      background: var(--primary-light);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .login-logo .material-symbols-outlined {
      font-size: 34px;
      color: var(--primary);
    }

    .login-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--gray-900);
      text-align: center;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--gray-500);
      text-align: center;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 7px;
    }

    .form-input {
      width: 100%;
      height: 44px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 0 14px;
      font-size: 14px;
      color: var(--gray-800);
      background: var(--white);
      font-family: var(--font-family);
      transition: var(--transition);
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,86,219,0.1);
      outline: none;
    }

    .form-input::placeholder { color: var(--gray-400); }

    .login-btn {
      width: 100%;
      height: 46px;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }

    .login-btn:hover {
      background: var(--primary-dark);
      box-shadow: 0 4px 14px rgba(26,86,219,0.35);
    }

    .login-btn .material-symbols-outlined { font-size: 20px; }

    .login-footer {
      text-align: center;
      font-size: 12px;
      color: var(--gray-400);
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--gray-200);
    }

    .login-note {
      background: var(--primary-light);
      border: 1px solid #BFDBFE;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 12px;
      color: var(--gray-600);
      margin-top: 20px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .login-note .material-symbols-outlined {
      font-size: 16px;
      color: var(--primary);
      flex-shrink: 0;
      margin-top: 1px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-logo">
    <span class="material-symbols-outlined">shield</span>
  </div>
  <div class="login-title">CIVILWATCH</div>
  <div class="login-subtitle">Administrator Login — Digos City</div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" class="form-input" id="username" placeholder="Enter your username" autocomplete="username" required />
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" id="password" placeholder="Enter your password" autocomplete="current-password" required />
    </div>

    <button type="submit" class="login-btn" id="loginBtn">
      <span class="material-symbols-outlined">login</span>
      Sign In
    </button>
  </form>

  <div class="login-note">
    <span class="material-symbols-outlined">info</span>
    <span>This is a <strong>prototype demo</strong>. Any username and password will work for demonstration purposes.</span>
  </div>

  <div class="login-footer">
    © 2026 CIVILWATCH. All rights reserved.<br>
    Digos City Government
  </div>
</div>

<script src="assets/js/utils.js"></script>
<script>
function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!username || !password) {
    Utils.showToast('Please enter both username and password', 'error');
    return;
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined" style="animation:spin 1s linear infinite;">sync</span> Signing in...';

  // Simulate login delay
  setTimeout(() => {
    Utils.showToast('Login successful! Redirecting...', 'success');
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 800);
  }, 1000);
}

// Auto-fill demo credentials on first visit
window.addEventListener('load', () => {
  document.getElementById('username').value = 'admin';
  document.getElementById('password').value = 'admin123';
});
</script>

<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
</style>

</body>
</html>
